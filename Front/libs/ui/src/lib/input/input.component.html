<div class="flex flex-col gap-2 p-2">
  <!-- If the label is set, include it -->
  @if (label) {
  <label [for]="id" class="text-base font-bold text-gray-700 ml-1">{{
    label
    }}</label>
  }

  <input [id]="id" [name]="name" [type]="type" [placeholder]="placeholder" [value]="value"
    (input)="onInputChange($event)"
    class="w-full px-4 py-2 bg-gray-50 border rounded-lg text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-blue-500 transition-colors shadow-sm focus:shadow-lg" />
</div>
