<div class="flex flex-col gap-2 w-full text-left p-2">
  @if (label) {
  <label [for]="id" class="text-base font-bold text-gray-700 ml-1">{{
    label
  }}</label>
  }

  <select
    [name]="name"
    [id]="id"
    [value]="selectedOption"
    (change)="onSelectChange($event)"
    class="w-full px-3 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-blue-500 transition-colors shadow-sm focus:shadow-lg cursor-pointer"
  >
    <option value="" disabled class="text-gray-400">Select an option...</option>
    @for (opt of options; track opt.value) {
    <option [value]="opt.value" class="text-gray-900">{{ opt.content }}</option>
    }
  </select>
</div>
