<div class="relative wrap overflow-hidden p-4">
  <div class="border-2-2 absolute border-opacity-20 border-gray-300 h-full border-l-2 left-6"></div>

  @if (events.length === 0) {
  <p class="text-gray-500 italic ml-6">No history available.</p>
  }

  <ul class="list-none m-0 p-0">
    @for (event of events; track event; let i = $index) {
    <li class="mb-8 flex justify-between items-start w-full">
      <div class="flex items-center w-full">
        <!-- Timeline Node / Dot -->
        <div
          class="z-10 flex items-center bg-white justify-center w-4 h-4 rounded-full border-4 shadow-sm {{ getDotColor(event.status) }} ring-4 ring-white">
        </div>

        <!-- Event Content -->
        <div
          class="ml-6 bg-white rounded-lg shadow-sm border border-gray-100 p-4 w-full transition-shadow hover:shadow-md">
          <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-1">
            <h4 class="text-base font-bold text-gray-800">{{ event.title }}</h4>
            <time class="text-xs font-medium text-gray-500">{{ event.timestamp }}</time>
          </div>
          @if (event.description) {
          <p class="text-sm text-gray-600 mt-2">{{ event.description }}</p>
          }
        </div>
      </div>
    </li>
    }
  </ul>
</div>

<lib-timeline 
  [events]="[
