<div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 transition-all hover:shadow-lg h-full flex flex-col">
  
  @if (isLoading) {
    <!-- Skeleton Loading State (Abstract) -->
    <div class="animate-pulse flex flex-col h-full">
      <!-- Optional Image/Header skeleton placeholder -->
      <div class="h-40 bg-gray-200 w-full"></div>
      
      <!-- Body skeleton placeholder -->
      <div class="p-5 flex flex-col gap-3 flex-grow">
        <div class="h-6 bg-gray-200 rounded-md w-3/4 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded-md w-full"></div>
        <div class="h-4 bg-gray-200 rounded-md w-5/6"></div>
      </div>
      
      <!-- Footer skeleton placeholder -->
      <div class="p-4 border-t border-gray-100 mt-auto">
        <div class="h-8 bg-gray-200 rounded-md w-1/3 ml-auto"></div>
      </div>
    </div>
  } @else {
    <!-- Actual Content -->
    
    <!-- Top area (for images, banners or custom headers) -->
    <ng-content select="[card-header]"></ng-content>
    
    <!-- Main Body area -->
    <div class="p-5 flex-grow">
      <ng-content></ng-content>
    </div>
    
    <!-- Bottom area (for buttons, actions, or footers) -->
    <div class="mt-auto">
      <ng-content select="[card-footer]"></ng-content>
    </div>
  }

</div>
