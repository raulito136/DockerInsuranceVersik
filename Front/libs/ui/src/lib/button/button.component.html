<button
  [type]="type === 'submit' ? 'submit' : 'button'"
  [disabled]="disabled"
  [className]="baseClasses + ' ' + colorClasses"
  (click)="!disabled && buttonClick.emit()"
>
  {{ contentText }}
</button>
