<div class="p-2">
  @if (label) {
  <label [for]="id" class="text-base font-bold text-gray-700 ml-1">{{
    label
  }}</label>
  }

  <textarea
    [id]="id"
    [name]="name"
    [rows]="rows"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInputChange($event)"
    class="w-full px-4 py-2 bg-gray-50 border rounded-lg text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-blue-500 transition-colors shadow-sm focus:shadow-lg resize-y"
  ></textarea>
</div>
