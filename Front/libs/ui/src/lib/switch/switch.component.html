<div class="flex items-center gap-3 p-2">
  @if (label) {
  <label [for]="id" class="text-base font-bold text-gray-700 ml-1 cursor-pointer">
    {{ label }}
  </label>
  }

  <label [for]="id" class="inline-flex items-center cursor-pointer relative">
    <input type="checkbox" [id]="id" [name]="name" [checked]="checked" (change)="onToggle($event)" class="sr-only peer">
    <div
      class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600 shadow-sm peer-focus:ring-2 peer-focus:ring-blue-600 peer-focus:ring-offset-1">
    </div>
  </label>
</div>
