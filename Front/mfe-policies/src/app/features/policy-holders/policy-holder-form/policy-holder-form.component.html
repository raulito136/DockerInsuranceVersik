<div class="p-6 max-w-4xl mx-auto">
  <div class="mb-6">
    <button (click)="onCancel()" class="text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-4 text-sm font-medium transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Back
    </button>
  </div>

  @if (globalErrorMessages.length > 0) {
    <lib-inline-error [message]="globalErrorMessages" />
  }

  @if (isLoading) {
    <div class="py-12 flex justify-center">
      <lib-loader text="Loading form data..." />
    </div>
  } @else {
    <lib-form 
      [title]="isEditMode ? 'Edit Policy Holder' : 'Create Policy Holder'" 
      subtitle="Provide the required details below" 
      (formSubmit)="onSubmit()">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <lib-input 
            label="First Name" 
            placeholder="e.g. Jane"
            [value]="form.get('firstName')?.value"
            (valueChange)="form.get('firstName')?.setValue($event)"
            [name]="'firstName'">
          </lib-input>
          <lib-inline-error [message]="getFieldError('firstName')" />
        </div>
        
        <div>
          <lib-input 
            label="Last Name" 
            placeholder="e.g. Doe"
            [value]="form.get('lastName')?.value"
            (valueChange)="form.get('lastName')?.setValue($event)"
            [name]="'lastName'">
          </lib-input>
          <lib-inline-error [message]="getFieldError('lastName')" />
        </div>
        
        <div>
          <lib-input 
            label="Email Address" 
            type="email"
            placeholder="jane.doe@example.com"
            [value]="form.get('email')?.value"
            (valueChange)="form.get('email')?.setValue($event)"
            [name]="'email'">
          </lib-input>
          <lib-inline-error [message]="getFieldError('email')" />
        </div>
        
        <div>
          <lib-input 
            label="Phone Number (Optional)" 
            placeholder="e.g. +61 400 000 000"
            [value]="form.get('phone')?.value"
            (valueChange)="form.get('phone')?.setValue($event)"
            [name]="'phone'">
          </lib-input>
          <lib-inline-error [message]="getFieldError('phone')" />
        </div>
        
        <div>
          <lib-datepicker 
            label="Date of Birth" 
            [selectedDate]="form.get('dateOfBirth')?.value"
            (selectedDateChange)="form.get('dateOfBirth')?.setValue($event)"
            [name]="'dateOfBirth'">
          </lib-datepicker>
          <lib-inline-error [message]="getFieldError('dateOfBirth')" />
        </div>
        
        <div>
          <lib-select 
            label="Region" 
            [options]="regionOptions"
            [selectedOption]="form.get('regionCode')?.value"
            (selectedOptionChange)="form.get('regionCode')?.setValue($event)"
            [name]="'regionCode'">
          </lib-select>
          <lib-inline-error [message]="getFieldError('regionCode')" />
        </div>
      </div>

      <div form-actions class="flex gap-2">
        <lib-button type="cancel" content="Cancel" (buttonClick)="onCancel()" />
        <lib-button type="submit" [content]="isSaving ? 'Saving...' : 'Save Policy Holder'" />
      </div>
    </lib-form>
  }
</div>
