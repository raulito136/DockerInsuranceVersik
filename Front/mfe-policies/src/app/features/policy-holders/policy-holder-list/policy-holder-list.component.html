<div class="p-6 max-w-7xl mx-auto">
  <!-- "Header" -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-slate-800">Policy Holders</h1>
      <p class="text-slate-500 mt-1">
        Manage policy holders and their profiles.
      </p>
    </div>
    <lib-button
      type="confirm"
      content="New Policy Holder"
      (buttonClick)="onCreate()"
    />
  </div>

  <!-- ERROR MESSAGE -->
  @if (errorMessage) {
  <div class="mb-6 p-4 bg-red-200 border border-red-200 rounded-lg">
    <lib-inline-error [message]="errorMessage" />
  </div>
  }

  <!-- TABLE -->
  @if (isLoading) {
  <div class="py-12 flex justify-center">
    <lib-loader text="Loading policy holders..." />
  </div>
  } @else {
  <div
    class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
  >
    <lib-table
      [columns]="columns"
      [data]="policyHolders"
      (rowClick)="onRowSelect($event)"
    >
    </lib-table>

    <div class="border-t border-slate-100 bg-slate-50 flex justify-end">
      <lib-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
      >
      </lib-pagination>
    </div>
  </div>
  }
</div>
