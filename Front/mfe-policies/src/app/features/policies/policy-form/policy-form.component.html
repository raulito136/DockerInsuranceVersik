<div class="p-6 max-w-4xl mx-auto">
  <div class="mb-6">
    <button
      (click)="onCancel()"
      class="text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-4 text-sm font-medium transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      Back
    </button>
  </div>

  <!-- ERROR MESSAGE -->
  @if (globalErrorMessage) {
  <div class="mb-6 p-4 bg-red-200 border border-red-200 rounded-lg">
    <lib-inline-error [message]="globalErrorMessage" />
  </div>
  }

  <!-- FORM ITSELF -->
  @if (isLoading) {
  <div class="py-12 flex justify-center">
    <lib-loader text="Loading form data..." />
  </div>
  } @else {
  <lib-form
    [title]="isEditMode ? 'Edit Policy' : 'Create Policy'"
    subtitle="Provide the required details below"
    (formSubmit)="onSubmit()"
  >
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div>
        <lib-select
          label="Policy Holder"
          [options]="policyHolderOptions"
          [selectedOption]="form.get('policyHolderId')?.value"
          (selectedOptionChange)="form.get('policyHolderId')?.setValue($event)"
          [name]="'policyHolderId'"
        >
        </lib-select>
        <lib-inline-error [message]="getFieldError('policyHolderId')" />
      </div>

      <!-- Empty div for grid spacing on create, or Status on edit -->
      @if (isEditMode) {
      <div>
        <lib-select
          label="Status"
          [options]="statusOptions"
          [selectedOption]="form.get('status')?.value"
          (selectedOptionChange)="form.get('status')?.setValue($event)"
          [name]="'status'"
        >
        </lib-select>
        <lib-inline-error [message]="getFieldError('status')" />
      </div>
      } @else {
      <div></div>
      }

      <div>
        <lib-select
          label="Policy Type"
          [options]="policyTypeOptions"
          [selectedOption]="form.get('policyTypeCode')?.value"
          (selectedOptionChange)="form.get('policyTypeCode')?.setValue($event)"
          [name]="'policyTypeCode'"
        >
        </lib-select>
        <lib-inline-error [message]="getFieldError('policyTypeCode')" />
      </div>

      <div>
        <lib-select
          label="Coverage Type"
          [options]="coverageTypeOptions"
          [selectedOption]="form.get('coverageTypeCode')?.value"
          (selectedOptionChange)="
            form.get('coverageTypeCode')?.setValue($event)
          "
          [name]="'coverageTypeCode'"
        >
        </lib-select>
        <lib-inline-error [message]="getFieldError('coverageTypeCode')" />
      </div>

      <div>
        <lib-input
          label="Coverage Amount"
          type="number"
          placeholder="0"
          [value]="form.get('coverageAmount')?.value"
          (valueChange)="form.get('coverageAmount')?.setValue($event)"
          [name]="'coverageAmount'"
        >
        </lib-input>
        <lib-inline-error [message]="getFieldError('coverageAmount')" />
      </div>

      <div>
        <lib-input
          label="Premium Amount"
          type="number"
          placeholder="0"
          [value]="form.get('premiumAmount')?.value"
          (valueChange)="form.get('premiumAmount')?.setValue($event)"
          [name]="'premiumAmount'"
        >
        </lib-input>
        <lib-inline-error [message]="getFieldError('premiumAmount')" />
      </div>

      <div>
        <lib-datepicker
          label="Start Date"
          [selectedDate]="form.get('startDate')?.value"
          (selectedDateChange)="form.get('startDate')?.setValue($event)"
          [name]="'startDate'"
        >
        </lib-datepicker>
        <lib-inline-error [message]="getFieldError('startDate')" />
      </div>

      <div>
        <lib-datepicker
          label="End Date"
          [selectedDate]="form.get('endDate')?.value"
          (selectedDateChange)="form.get('endDate')?.setValue($event)"
          [name]="'endDate'"
        >
        </lib-datepicker>
        <lib-inline-error [message]="getFieldError('endDate')" />
      </div>
    </div>

    <div form-actions class="flex gap-2">
      <lib-button type="cancel" content="Cancel" (buttonClick)="onCancel()" />
      <lib-button
        type="submit"
        [content]="isSaving ? 'Saving...' : 'Save Policy'"
      />
    </div>
  </lib-form>
  }
</div>
